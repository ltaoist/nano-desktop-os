<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计算器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1e1e36;color:#e0e0e0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:auto}
#app{text-align:center}
.loading{color:#666;font-size:14px}
.error{color:#f44336}

.calc{background:#212140;border-radius:12px;padding:16px;width:300px;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.calc-display{background:#16162a;border-radius:8px;padding:12px 16px;margin-bottom:12px;text-align:right;min-height:48px}
.calc-display .expr{font-size:13px;color:#888;min-height:18px;word-break:break-all}
.calc-display .result{font-size:22px;font-weight:600;color:#fff;word-break:break-all}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-keys button{padding:12px 0;border:none;border-radius:8px;font-size:16px;cursor:pointer;transition:background 0.1s}
.btn-num{background:#2a2a48;color:#e0e0e0}.btn-num:hover{background:#3a3a5a}
.btn-op{background:#3a5a8a;color:#fff}.btn-op:hover{background:#4a6a9a}
.btn-eq{background:#2e7d32;color:#fff}.btn-eq:hover{background:#388e3c}
.btn-clr{background:#6e3030;color:#fff}.btn-clr:hover{background:#8e4040}
.btn-wide{grid-column:span 2}

.history{margin-top:12px;max-height:120px;overflow-y:auto;text-align:left;font-size:12px;color:#888}
.history .h-item{padding:2px 0;border-bottom:1px solid #2a2a44}
</style>
</head>
<body>
<div id="app"><div class="loading">正在连接...</div></div>
<script src="/nano_tob.js"></script>
<script>
(function() {
  var app = document.getElementById('app');
  var tob = null;
  var expr = '';
  var elDisplay, elResult, elHistory;

  function log(msg, cls) {
    app.innerHTML = '<div class="' + (cls||'loading') + '">' + msg + '</div>';
  }

  function buildCalculator() {
    app.innerHTML = '<div class="calc">' +
      '<div class="calc-display"><div class="expr" id="expr"></div><div class="result" id="result">0</div></div>' +
      '<div class="calc-keys">' +
      '<button class="btn-clr" onclick="window._calcSend(\'C\')">C</button>' +
      '<button class="btn-num" onclick="window._calcSend(\'(\')">(</button>' +
      '<button class="btn-num" onclick="window._calcSend(\')\')">)</button>' +
      '<button class="btn-op" onclick="window._calcSend(\'/\')">&divide;</button>' +
      '<button class="btn-num" onclick="window._calcSend(\'7\')">7</button><button class="btn-num" onclick="window._calcSend(\'8\')">8</button><button class="btn-num" onclick="window._calcSend(\'9\')">9</button><button class="btn-op" onclick="window._calcSend(\'*\')">&times;</button>' +
      '<button class="btn-num" onclick="window._calcSend(\'4\')">4</button><button class="btn-num" onclick="window._calcSend(\'5\')">5</button><button class="btn-num" onclick="window._calcSend(\'6\')">6</button><button class="btn-op" onclick="window._calcSend(\'-\')">&minus;</button>' +
      '<button class="btn-num" onclick="window._calcSend(\'1\')">1</button><button class="btn-num" onclick="window._calcSend(\'2\')">2</button><button class="btn-num" onclick="window._calcSend(\'3\')">3</button><button class="btn-op" onclick="window._calcSend(\'+\')">+</button>' +
      '<button class="btn-num btn-wide" onclick="window._calcSend(\'0\')">0</button><button class="btn-num" onclick="window._calcSend(\'.\')">.</button><button class="btn-eq" onclick="window._calcSend(\'=\')">=</button>' +
      '</div><div class="history" id="history"></div></div>';

    elDisplay = document.getElementById('expr');
    elResult = document.getElementById('result');
    elHistory = document.getElementById('history');
  }

  window._calcSend = function(key) {
    if (!tob) return;
    if (key === 'C') { expr = ''; elDisplay.textContent = ''; elResult.textContent = '0'; return; }
    if (key === '=') {
      if (!expr.trim()) return;
      callTOBMethod(tob, 'calculate', [expr]).then(function(r) {
        if (r && r.error) { elResult.textContent = 'Error'; elDisplay.textContent = expr + ' ='; }
        else if (r) {
          elDisplay.textContent = expr + ' =';
          elResult.textContent = r.result;
          elHistory.innerHTML = (r.history || []).map(function(h) { return '<div class="h-item">' + h + '</div>'; }).join('');
          expr = '';
        }
      }).catch(function(e) { elResult.textContent = e.message || 'Error'; });
      return;
    }
    expr += key;
    elDisplay.textContent = expr;
  };

  (async function() {
    try {
      log('连接中...');
      await initializeTOBM('//' + location.host + '/ws');
      tob = await waitNamedTOB('app', 10000);
      if (!tob) { log('应用未就绪', 'error'); return; }
      buildCalculator();
      try {
        var h = await callTOBMethod(tob, 'get_history', []);
        if (h && h.length) {
          elHistory.innerHTML = h.map(function(v) { return '<div class="h-item">' + v + '</div>'; }).join('');
        }
      } catch(e) {}
    } catch(e) { log(e.message, 'error'); }
  })();
})();
</script>
</body>
</html>
